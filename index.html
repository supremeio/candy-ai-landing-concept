h1,h2,.cd-display{font-family:'Clash Display',Figtree,system-ui,sans-serif}
body{margin:0;background:#1A0B10}
a{color:inherit}
.cd-trait{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px 12px;border:0;border-radius:18px;background:#3A2830;color:#F7F4EE;font:700 13.5px Figtree,system-ui,sans-serif;text-align:left;cursor:pointer;transition:background .25s,color .25s}
.cd-trait small{font-size:12px;font-weight:500;color:#B9AEB4;transition:color .25s}
.cd-trait.cd-on{background:#F97187;color:#1A0B10}
.cd-trait.cd-on small{color:#4A1F2C}
.cd-opt{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px 8px 12px;border-radius:20px;border:2px solid #E6DFD6;background:#FFFFFF;color:#1A0B10;font:600 14px Figtree,system-ui,sans-serif;cursor:pointer;text-align:left}
.cd-opt.cd-on{border-color:#F97187}
.cd-trait:focus-visible,.cd-opt:focus-visible,.cd-cta:focus-visible,.cd-ghost:focus-visible{outline:2px solid #F97187;outline-offset:3px}
.cd-swap{animation:cdSwap .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes cdSwap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cd-sheet{animation:cdUp .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes cdUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.cd-play{animation:cdPlay 6s linear infinite}
@keyframes cdPlay{from{width:0}to{width:100%}}
.cd-dot{animation:cdBlink 1.2s infinite}
@keyframes cdBlink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.cd-marquee{display:flex;width:max-content;animation:cdMarquee 26s linear infinite}
@keyframes cdMarquee{to{transform:translateX(-50%)}}
.cd-wheel{animation:cdSpin 100s linear infinite}
.cd-wheel.cd-stop{animation-play-state:paused}
@keyframes cdSpin{to{transform:rotate(360deg)}}
.cd-pause{display:grid;place-items:center;width:32px;height:32px;padding:0;border-radius:50%;border:1.5px solid #1A0B10;background:transparent;color:#1A0B10;cursor:pointer}
.cd-pause:focus-visible{outline:2px solid #F97187;outline-offset:3px}
.cd-field{animation:cdField 40s linear infinite}
@keyframes cdField{from{transform:translateX(0)}to{transform:translateX(360px)}}
.cd-spin{transform-box:fill-box;transform-origin:center;animation:cdSpin 12s linear infinite}
.cd-wings{transform-box:fill-box;transform-origin:center;animation:cdFlap 3.4s ease-in-out infinite}
@keyframes cdFlap{0%,58%,100%{transform:scaleX(1)}68%{transform:scaleX(.25)}78%{transform:scaleX(1)}86%{transform:scaleX(.4)}94%{transform:scaleX(1)}}
.cd-caret{display:inline-block;width:1.5px;height:12px;margin-left:1px;background:#1A0B10;animation:cdCaret .8s steps(1) infinite}
@keyframes cdCaret{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cd-swap,.cd-sheet,.cd-play{animation-duration:.01s;animation-delay:0s}.cd-dot,.cd-marquee,.cd-wheel,.cd-field,.cd-spin,.cd-wings{animation:none}}
</style>

        <span aria-hidden="true" style="display: block; width: 40px; height: 4px; margin: 0 auto 16px; border-radius: 4px; background: #DCD4C9;"></span>
        <p style="margin: 0 0 4px; font-size: 13px; font-weight: 600; color: #6B6370;">Step 1 of 3</p>
        <h2 id="st-title" style="margin: 0 0 16px; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em;">Choose her style</h2>
        <div role="group" aria-label="Style" style="display: flex; gap: 10px;">
          <button type="button" class="{{lookR.cls}}" aria-pressed="{{lookR.pressed}}" onClick="{{lookR.pick}}"><img src="assets/portrait-mia.jpg" alt="" style="display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 14px; object-fit: cover; object-position: 50% 25%; background: #F8D9E1;">Realistic</button><button type="button" class="{{lookA.cls}}" aria-pressed="{{lookA.pressed}}" onClick="{{lookA.pick}}"><span aria-hidden="true" style="display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 14px; background: #E6DDF5;"></span>Anime</button>
        </div>

        <a class="cd-cta" href="https://candy.ai/users/sign_up" style="display: flex; align-items: center; justify-content: center; height: 54px; margin-top: 18px; border-radius: 999px; background: #F97187; color: #1A0B10; font-size: 16px; font-weight: 700; text-decoration: none;">Continue</a>

      </div>
    </div>
  </sc-if>

<script>
// Tiny runtime for the {{hole}} / <sc-if> template used by the design canvas.
// It binds the markup once and updates only what changes, so CSS animations keep running.
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(patch) { Object.assign(this.state, typeof patch === 'function' ? patch(this.state) : patch); if (this.__render) this.__render(); }
  forceUpdate() { if (this.__render) this.__render(); }
}
(function () {
  const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  const look = (vals, path) => {
    if (path === 'true') return true;
    if (path === 'false') return false;
    return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), vals);
  };
  function bind(root, out) {
    const walk = (node) => {
      if (node.nodeType === 3) {
        if (!node.nodeValue.includes('{{')) return;
        const parts = node.nodeValue.split(/(\{\{[^}]+\}\})/);
        const frag = document.createDocumentFragment();
        parts.forEach((p) => {
          const m = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(p);
          const t = document.createTextNode(m ? '' : p);
          if (m) out.push({ kind: 'text', node: t, path: m[1] });
          frag.appendChild(t);
        });
        node.parentNode.replaceChild(frag, node);
        return;
      }
      if (node.nodeType !== 1) return;
      if (node.tagName === 'SC-IF') {
        const anchor = document.createComment('if');
        const path = /\{\{\s*([^}]+?)\s*\}\}/.exec(node.getAttribute('value'))[1];
        node.parentNode.replaceChild(anchor, node);
        out.push({ kind: 'if', anchor, path, tpl: node, inst: null });
        return;
      }
      [...node.attributes].forEach((a) => {
        if (a.name.startsWith('hint-placeholder')) { node.removeAttribute(a.name); return; }
        if (!a.value.includes('{{')) return;
        const whole = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(a.value);
        node.removeAttribute(a.name);
        if (a.name.startsWith('on')) {
          const ev = a.name.slice(2);
          const b = { kind: 'event', el: node, path: whole[1], fn: null };
          node.addEventListener(ev, (e) => { if (b.fn) b.fn(e); });
          out.push(b);
        } else if (a.name === 'ref') {
          out.push({ kind: 'ref', el: node, path: whole[1], done: false });
        } else {
          out.push({ kind: 'attr', el: node, name: a.name === 'classname' ? 'class' : a.name, tpl: a.value });
        }
      });
      [...node.childNodes].forEach(walk);
    };
    [...root.childNodes].forEach(walk);
  }
  function update(bs, vals) {
    bs.forEach((b) => {
      if (b.kind === 'text') { const v = look(vals, b.path); const s = v == null ? '' : String(v); if (b.node.nodeValue !== s) b.node.nodeValue = s; }
      else if (b.kind === 'attr') { const s = b.tpl.replace(HOLE, (_, p) => { const v = look(vals, p); return v == null ? '' : String(v); }); if (b.el.getAttribute(b.name) !== s) b.el.setAttribute(b.name, s); }
      else if (b.kind === 'event') { b.fn = look(vals, b.path); }
      else if (b.kind === 'ref') { if (!b.done) { b.done = true; const f = look(vals, b.path); if (typeof f === 'function') f(b.el); } }
      else if (b.kind === 'if') {
        const on = !!look(vals, b.path);
        if (on && !b.inst) {
          const frag = document.createDocumentFragment();
          [...b.tpl.childNodes].forEach((c) => frag.appendChild(c.cloneNode(true)));
          const inner = []; bind(frag, inner);
          const nodes = [...frag.childNodes];
          b.anchor.parentNode.insertBefore(frag, b.anchor.nextSibling);
          b.inst = { nodes, inner };
        } else if (!on && b.inst) {
          b.inst.nodes.forEach((n) => n.remove()); b.inst = null;
        }
        if (b.inst) update(b.inst.inner, vals);
      }
    });
  }
  window.__mountDC = function (Component, mount) {
    const frag = document.getElementById('dc-template').content.cloneNode(true);
    const bs = []; bind(frag, bs);
    const comp = new Component({});
    comp.__render = () => update(bs, comp.renderVals());
    comp.__render();
    mount.appendChild(frag);
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

const PROMPT = '"Golden hour, wind in your hair"';
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const canWatch = typeof window !== 'undefined' && 'IntersectionObserver' in window;
    this.state = { tagPhase: 'dots', tagN: 0, tag2Phase: 'hidden', tag2N: 0, promptPhase: canWatch ? 'idle' : 'done', promptN: canWatch ? 0 : PROMPT.length, vibe: 'Playful', typing: false, look: 'Realistic', sheet: false, spin: true };
    // Type the video prompt out when the video card scrolls into view; reset once it leaves
    this.videoRef = (el) => {
      if (this.io) { this.io.disconnect(); this.io = null; }
      if (!el || !canWatch) return;
      this.io = new IntersectionObserver((entries) => {
        const e = entries[0];
        if (e.isIntersecting && e.intersectionRatio >= 0.5) this.typePrompt();
        else if (!e.isIntersecting) this.resetPrompt();
      }, { threshold: [0, 0.5] });
      this.io.observe(el);
    };
  }
  typePrompt() {
    if (this.state.promptPhase !== 'idle') return;
    const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) { this.setState({ promptPhase: 'done', promptN: PROMPT.length }); return; }
    this.setState({ promptPhase: 'typing', promptN: 0 });
    clearInterval(this.promptI);
    this.promptI = setInterval(() => {
      const n = this.state.promptN + 1;
      if (n >= PROMPT.length) { clearInterval(this.promptI); this.setState({ promptPhase: 'done', promptN: PROMPT.length }); }
      else this.setState({ promptN: n });
    }, 55);
  }
  resetPrompt() {
    clearInterval(this.promptI);
    if (this.state.promptPhase !== 'idle') this.setState({ promptPhase: 'idle', promptN: 0 });
  }
  componentDidMount() { this.startTag(); }
  componentWillUnmount() { clearTimeout(this.typeTimer); clearInterval(this.tagI); clearInterval(this.promptI); if (this.io) this.io.disconnect(); }
  startTag() {
    // One clock drives both bubbles, so they always play in step. The exchange restarts every 30 seconds.
    const one = 'AI companion';
    const two = 'Made by you';
    const LOOP = 30000, STEP = 75;
    const oneType = 1400, oneDone = oneType + one.length * STEP;
    const twoDots = oneDone + 400, twoType = twoDots + 1100, twoDone = twoType + two.length * STEP;
    clearInterval(this.tagI);
    const still = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (still) { this.setState({ tagPhase: 'done', tagN: one.length, tag2Phase: 'done', tag2N: two.length }); return; }
    const start = Date.now();
    const tick = () => {
      const t = (Date.now() - start) % LOOP;
      const next = {
        tagPhase: t < oneType ? 'dots' : (t < oneDone ? 'typing' : 'done'),
        tagN: t < oneType ? 0 : Math.min(one.length, Math.floor((t - oneType) / STEP) + 1),
        tag2Phase: t < twoDots ? 'hidden' : (t < twoType ? 'dots' : (t < twoDone ? 'typing' : 'done')),
        tag2N: t < twoType ? 0 : Math.min(two.length, Math.floor((t - twoType) / STEP) + 1)
      };
      const st = this.state;
      if (next.tagPhase !== st.tagPhase || next.tagN !== st.tagN || next.tag2Phase !== st.tag2Phase || next.tag2N !== st.tag2N) this.setState(next);
    };
    tick();
    this.tagI = setInterval(tick, 50);
  }
  renderVals() {
    const vibe = this.state.vibe;
    const typing = this.state.typing;
    const vibeBtn = (label) => ({
      pressed: vibe === label ? 'true' : 'false',
      cls: vibe === label ? 'cd-trait cd-on' : 'cd-trait',
      pick: () => {
        if (label === vibe) return;
        clearTimeout(this.typeTimer);
        this.setState({ vibe: label, typing: true });
        this.typeTimer = setTimeout(() => this.setState({ typing: false }), 700);
      }
    });
    const looks = [
      { label: 'Realistic', bg: '#F8D9E1' },
      { label: 'Anime', bg: '#E6DDF5' }
    ].map((o) => ({
      label: o.label,
      bg: o.bg,
      pressed: this.state.look === o.label ? 'true' : 'false',
      cls: this.state.look === o.label ? 'cd-opt cd-on' : 'cd-opt',
      pick: () => this.setState({ look: o.label })
    }));
    const tagPhase = this.state.tagPhase;
    return {
      videoRef: this.videoRef,
      promptText: PROMPT.slice(0, this.state.promptN),
      promptCaret: this.state.promptPhase !== 'done',
      tagDots: tagPhase === 'dots',
      tagShowText: tagPhase !== 'dots',
      tagText: 'AI companion'.slice(0, this.state.tagN),
      tagCaret: tagPhase === 'typing',
      tag2Show: this.state.tag2Phase !== 'hidden',
      tag2Dots: this.state.tag2Phase === 'dots',
      tag2ShowText: this.state.tag2Phase === 'typing' || this.state.tag2Phase === 'done',
      tag2Text: 'Made by you'.slice(0, this.state.tag2N),
      tag2Caret: this.state.tag2Phase === 'typing',
      wheelCls: this.state.spin ? 'cd-wheel' : 'cd-wheel cd-stop',
      spinning: this.state.spin,
      stopped: !this.state.spin,
      spinLabel: this.state.spin ? 'Pause the moving images' : 'Play the moving images',
      toggleSpin: () => this.setState({ spin: !this.state.spin }),
      vP: vibeBtn('Playful'),
      vT: vibeBtn('Thoughtful'),
      vA: vibeBtn('Adventurous'),
      typing: typing,
      lookR: looks[0],
      lookA: looks[1],
      isPlayful: !typing && vibe === 'Playful',
      isThoughtful: !typing && vibe === 'Thoughtful',
      isAdventurous: !typing && vibe === 'Adventurous',
      vibeLabel: vibe,
      sheetOpen: this.state.sheet,
      openSheet: () => this.setState({ sheet: true }),
      closeSheet: () => this.setState({ sheet: false })
    };
  }
}

window.__mountDC(Component, document.getElementById('app'));
</script>
